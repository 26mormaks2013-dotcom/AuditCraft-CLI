[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcraft-cli"
version = "0.2.0"
description = "AuditCraft CLI — automation for smart contract auditors: scope (nSLOC + Cyclomatic Complexity), 13 static detectors, multi-format reports (markdown/c4/cantina), Foundry/Anchor PoC generator."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AuditCraft Contributors" },
]
keywords = ["audit", "solidity", "rust", "security", "cli", "nsloc", "foundry", "anchor", "code4rena", "cantina"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
auditcraft = "auditcraft.main:app"

[project.urls]
Homepage = "https://github.com/auditcraft/auditcraft-cli"
Issues = "https://github.com/auditcraft/auditcraft-cli/issues"

[tool.setuptools.packages.find]
include = ["auditcraft*"]
namespaces = true

[tool.setuptools.package-data]
auditcraft = ["templates/*.j2", "templates/*.md.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.coverage.run]
source = ["auditcraft"]
branch = true
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
