[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcraft-cli"
version = "0.1.0"
description = "AuditCraft CLI — automation for smart contract auditors (nSLOC scope, audit reports, static checks)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AuditCraft Contributors" },
]
keywords = ["audit", "solidity", "rust", "security", "cli", "nsloc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
auditcraft = "auditcraft.main:app"

[project.urls]
Homepage = "https://github.com/auditcraft/auditcraft-cli"
Issues = "https://github.com/auditcraft/auditcraft-cli/issues"

[tool.setuptools]
packages = ["auditcraft", "auditcraft.cli", "auditcraft.core", "auditcraft.models"]
include-package-data = true

[tool.setuptools.package-data]
auditcraft = ["templates/*.j2", "templates/*.md.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
